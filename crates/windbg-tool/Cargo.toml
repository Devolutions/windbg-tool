[package]
name = "windbg-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[package.metadata.winresource]
ProductName = "WinDbg Tool"
FileDescription = "WinDbg automation CLI and MCP server"
CompanyName = "Devolutions"
LegalCopyright = "Copyright (c) Devolutions"
OriginalFilename = "windbg-tool.exe"
InternalName = "windbg-tool"

[dependencies]
anyhow.workspace = true
clap.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
windbg-dbgeng = { path = "..\\windbg-dbgeng" }
windbg-install = { path = "..\\windbg-install" }
windbg-symbols = { path = "..\\windbg-symbols" }
windbg-ttd = { path = "..\\windbg-ttd" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1.23"
