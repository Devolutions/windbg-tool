name: Windows packages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 0.1.0)
        required: true
        type: string
      dry_run:
        description: Build, sign, and validate release packages without creating a tag or release
        required: false
        default: false
        type: boolean
      publish_nuget:
        description: Publish .NET tool packages containing signed Windows payloads to NuGet.org
        required: false
        default: true
        type: boolean
      github_env:
        description: GitHub environment for Azure Trusted Signing and NuGet publishing
        required: false
        default: auto
        type: choice
        options:
          - auto
          - test
          - prod

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish_env: ${{ steps.resolve.outputs.publish_env }}

    steps:
      - name: Resolve release environment
        id: resolve
        shell: pwsh
        env:
          REQUESTED_ENV: ${{ inputs.github_env }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $dryRun = [System.Boolean]::Parse($env:DRY_RUN)
          $isMaster = $env:GITHUB_REF -eq 'refs/heads/master'

          if (-not $dryRun -and -not $isMaster) {
            throw 'Non-dry-run releases must be dispatched from the master branch.'
          }

          if (-not $isMaster) {
            $publishEnvironment = 'publish-test'
          }
          else {
            $publishEnvironment = switch ($env:REQUESTED_ENV) {
              'test' { 'publish-test'; break }
              default { 'publish-prod' }
            }
          }

          "publish_env=$publishEnvironment" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release environment: $publishEnvironment"

  package:
    name: Package ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            rust_target: x86_64-pc-windows-msvc
            nuget_arch: amd64
            vcvars_arch: x64
            artifact: windbg-tool-x64
            can_run: true
          - label: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            nuget_arch: arm64
            vcvars_arch: x64_arm64
            artifact: windbg-tool-arm64
            can_run: false

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add ${{ matrix.rust_target }}

      - name: Restore debugger dependencies
        shell: pwsh
        run: cargo xtask deps --arch ${{ matrix.nuget_arch }}

      - name: Ensure ARM64 MSVC toolset
        if: matrix.nuget_arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }
          if (-not (Test-Path $installer)) {
            throw "vs_installer.exe was not found at $installer"
          }
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) {
            throw 'Could not find a Visual Studio installation with the MSVC x64 toolset'
          }
          & $installer modify `
            --installPath $installationPath `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --quiet `
            --norestart `
            --nocache `
            --wait
          if (($LASTEXITCODE -ne 0) -and ($LASTEXITCODE -ne 3010)) {
            exit $LASTEXITCODE
          }

      - name: Build native bridge
        shell: pwsh
        env:
          WINDBG_TOOL_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) {
            throw 'Could not find a Visual Studio installation with the MSVC x64 toolset'
          }
          $vcvars = Join-Path $installationPath 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" ${{ matrix.vcvars_arch }} && cargo xtask native-build --arch ${{ matrix.nuget_arch }} --static-crt"

      - name: Build windbg-tool
        shell: pwsh
        env:
          WINDBG_TOOL_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) {
            throw 'Could not find a Visual Studio installation with the MSVC x64 toolset'
          }
          $vcvars = Join-Path $installationPath 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" ${{ matrix.vcvars_arch }} && cargo build -p windbg-tool --release --target ${{ matrix.rust_target }}"

      - name: Package runtime files
        shell: pwsh
        run: |
          cargo xtask package `
            --arch ${{ matrix.nuget_arch }} `
            --target ${{ matrix.rust_target }} `
            --profile release `
            --out "target\package\${{ matrix.artifact }}"

      - name: Validate package and create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageDir = Join-Path $PWD 'target\package\${{ matrix.artifact }}'
          $zipPath = Join-Path $PWD 'target\package\${{ matrix.artifact }}.zip'
          $requiredFiles = @(
            'windbg-tool.exe',
            'ttd_replay_bridge.dll',
            'TTDReplay.dll',
            'TTDReplayCPU.dll',
            'dbgeng.dll',
            'dbgcore.dll',
            'dbghelp.dll',
            'dbgmodel.dll',
            'msdia140.dll',
            'srcsrv.dll'
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $packageDir $file
            if (-not (Test-Path $path)) {
              throw "Package is missing required file: $file"
            }
          }

          $ownedBinaries = @(
            @{ Name = 'windbg-tool.exe'; OriginalFilename = 'windbg-tool.exe' },
            @{ Name = 'ttd_replay_bridge.dll'; OriginalFilename = 'ttd_replay_bridge.dll' }
          )
          $expectedVersion = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            $expectedVersion = '0.3.0'
          }
          $expectedFileVersion = if ($expectedVersion -match '^(?<core>\d+(?:\.\d+){0,3})') {
            $parts = @($Matches['core'] -split '\.')
            while ($parts.Count -lt 4) { $parts += '0' }
            ($parts[0..3] -join '.')
          } else {
            throw "Unable to derive PE file version from '$expectedVersion'"
          }

          foreach ($binary in $ownedBinaries) {
            $path = Join-Path $packageDir $binary.Name
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path)
            if ([string]::IsNullOrWhiteSpace($info.CompanyName) -or $info.CompanyName -ne 'Devolutions') {
              throw "$($binary.Name) is missing CompanyName=Devolutions (got '$($info.CompanyName)')"
            }
            if ([string]::IsNullOrWhiteSpace($info.ProductName) -or $info.ProductName -ne 'WinDbg Tool') {
              throw "$($binary.Name) is missing ProductName=WinDbg Tool (got '$($info.ProductName)')"
            }
            if ([string]::IsNullOrWhiteSpace($info.FileDescription)) {
              throw "$($binary.Name) is missing FileDescription"
            }
            if ([string]::IsNullOrWhiteSpace($info.FileVersion)) {
              throw "$($binary.Name) is missing FileVersion"
            }
            if ($info.FileVersion -ne $expectedFileVersion -and $info.FileVersion -ne $expectedVersion) {
              throw "$($binary.Name) FileVersion '$($info.FileVersion)' does not match expected '$expectedFileVersion'"
            }
            if ([string]::IsNullOrWhiteSpace($info.ProductVersion) -or (
                $info.ProductVersion -ne $expectedVersion -and
                $info.ProductVersion -ne $expectedFileVersion
              )) {
              throw "$($binary.Name) ProductVersion '$($info.ProductVersion)' does not match expected '$expectedVersion'"
            }
            if ($info.OriginalFilename -ne $binary.OriginalFilename) {
              throw "$($binary.Name) OriginalFilename '$($info.OriginalFilename)' does not match '$($binary.OriginalFilename)'"
            }
            Write-Host ("Version OK: {0} FileVersion={1} ProductVersion={2} Company={3}" -f `
              $binary.Name, $info.FileVersion, $info.ProductVersion, $info.CompanyName)
          }

          if ('${{ matrix.can_run }}' -eq 'true') {
            Push-Location $packageDir
            try {
              & '.\windbg-tool.exe' discover | Out-Null
            }
            finally {
              Pop-Location
            }
          }

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $zipPath -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('/', '\') })
            foreach ($file in $requiredFiles) {
              if ($entries -notcontains $file) {
                throw "ZIP is missing required file: $file"
              }
            }
          }
          finally {
            $zip.Dispose()
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target\package\${{ matrix.artifact }}.zip
          if-no-files-found: error

  sign-and-pack:
    name: Sign and pack .NET tool
    if: github.event_name == 'workflow_dispatch'
    needs:
      - package
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.preflight.outputs.publish_env }}
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      PSIGN_VERSION: 0.6.2
      PSIGN_SHA256: f3694e723d270c632b7b104b781112f8d0ed28e9756662446a41e71c0eb26ead

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download unsigned Windows x64 package
        uses: actions/download-artifact@v8
        with:
          name: windbg-tool-x64
          path: work/archives/win-x64

      - name: Download unsigned Windows ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: windbg-tool-arm64
          path: work/archives/win-arm64

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve signing mode
        id: signing_mode
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
        run: |
          $requiredValues = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:TRUSTED_SIGNING_ENDPOINT,
            $env:TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:TRUSTED_SIGNING_PROFILE_NAME
          )

          $hasSigningSecrets = $true
          foreach ($value in $requiredValues) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              $hasSigningSecrets = $false
              break
            }
          }

          if (-not $hasSigningSecrets) {
            throw 'Azure Trusted Signing configuration is required for every release dispatch, including dry runs.'
          }

          "should_sign=true" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'Windows binaries will be signed with Azure Trusted Signing.'

      - name: Download Linux psign-tool
        if: steps.signing_mode.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'psign-tool'
          if (Test-Path -LiteralPath $toolRoot) {
            Remove-Item -LiteralPath $toolRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          $archivePath = Join-Path $toolRoot 'psign-tool.zip'
          $archiveUrl = "https://github.com/Devolutions/psign/releases/download/v$env:PSIGN_VERSION/psign-tool-linux-x64.zip"
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:PSIGN_SHA256) {
            throw "SHA-256 mismatch for downloaded psign-tool: expected $env:PSIGN_SHA256, got $archiveHash"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $toolRoot -Force

          $toolPath = Join-Path $toolRoot 'psign-tool'
          if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
            throw "Linux psign-tool was not found after extracting $archiveUrl"
          }

          & chmod +x $toolPath
          $toolRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $toolPath --version
          if ($LASTEXITCODE -ne 0) {
            throw 'The downloaded psign-tool could not be executed.'
          }

      - name: Azure login for Trusted Signing
        if: steps.signing_mode.outputs.should_sign == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Arrange package payloads
        shell: pwsh
        run: |
          $workRoot = Join-Path $PWD 'work'
          $archiveRoot = Join-Path $workRoot 'archives'
          $stagingRoot = Join-Path $workRoot 'payload'
          New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null

          foreach ($rid in @('win-x64', 'win-arm64')) {
            $archiveDirectory = Join-Path $archiveRoot $rid
            $archive = Get-ChildItem -LiteralPath $archiveDirectory -Filter '*.zip' -File |
              Select-Object -First 1
            if ($null -eq $archive) {
              throw "Unsigned package ZIP was not downloaded for $rid."
            }

            $payloadDirectory = Join-Path $stagingRoot $rid
            New-Item -ItemType Directory -Force -Path $payloadDirectory | Out-Null
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $payloadDirectory -Force

            foreach ($file in @(
                'windbg-tool.exe',
                'ttd_replay_bridge.dll',
                'TTDReplay.dll',
                'TTDReplayCPU.dll',
                'dbgeng.dll',
                'dbgcore.dll',
                'dbghelp.dll',
                'dbgmodel.dll',
                'msdia140.dll',
                'srcsrv.dll')) {
              $path = Join-Path $payloadDirectory $file
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Package for $rid is missing required file: $file"
              }
            }
          }

      - name: Build dotnet tool launcher
        shell: pwsh
        run: |
          $project = (Resolve-Path (Join-Path $PWD 'packaging/dotnet-tool/Devolutions.WinDbg.Tool.csproj')).Path
          $stagingRoot = (Resolve-Path (Join-Path $PWD 'work/payload')).Path

          dotnet restore $project
          if ($LASTEXITCODE -ne 0) {
            throw 'dotnet tool project restore failed.'
          }

          foreach ($rid in @('win-x64', 'win-arm64', 'any')) {
            $buildArgs = @(
              'build',
              $project,
              '-c', 'Release',
              '-r', $rid,
              '--no-restore',
              "-p:WindbgToolStagingRoot=$stagingRoot"
            )

            & dotnet @buildArgs
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet tool launcher build failed for $rid."
            }
          }

      - name: Code sign Windows binaries with Trusted Signing
        if: steps.signing_mode.outputs.should_sign == 'true'
        shell: pwsh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER || 'http://timestamp.acs.microsoft.com/' }}
        run: |
          $accessToken = az account get-access-token `
            --scope https://codesigning.azure.net/.default `
            --query accessToken `
            --output tsv

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
            throw 'Failed to acquire a Trusted Signing data-plane access token.'
          }

          $projectRoot = Join-Path $PWD 'packaging/dotnet-tool'
          $project = Join-Path $projectRoot 'Devolutions.WinDbg.Tool.csproj'
          $targets = @()
          foreach ($rid in @('win-x64', 'win-arm64', 'any')) {
            # dotnet pack --no-build packages the files resolved by
            # ComputeResolvedFilesToPublishList.  The apphost and managed
            # launcher assembly currently come from obj/, not bin/, so sign
            # the resolved sources rather than the build output copies.
            $resolvedFilesJson = & dotnet msbuild $project `
              -nologo `
              -t:ComputeResolvedFilesToPublishList `
              -p:Configuration=Release `
              -p:RuntimeIdentifier=$rid `
              -p:NoBuild=true `
              -getItem:ResolvedFileToPublish
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to resolve launcher files that dotnet pack will use for $rid."
            }

            $launcherNames = @('Devolutions.WinDbg.Tool.dll')
            if ($rid -ne 'any') {
              $launcherNames += 'Devolutions.WinDbg.Tool.exe'
            }
            $resolvedLaunchers = @(
              ($resolvedFilesJson | ConvertFrom-Json).Items.ResolvedFileToPublish |
                Where-Object { $_.RelativePath -in $launcherNames } |
                ForEach-Object { $_.FullPath } |
                Sort-Object -Unique
            )
            if ($resolvedLaunchers.Count -ne $launcherNames.Count) {
              throw "Expected $($launcherNames.Count) launcher file(s) for $rid, but dotnet pack resolved $($resolvedLaunchers.Count)."
            }
            $targets += $resolvedLaunchers

            if ($rid -eq 'any') {
              continue
            }

            $payloadRoot = Join-Path (Join-Path $PWD 'work/payload') $rid
            $targets += Join-Path $payloadRoot 'windbg-tool.exe'
            $targets += Join-Path $payloadRoot 'ttd_replay_bridge.dll'
          }

          foreach ($target in ($targets | Sort-Object -Unique)) {
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Signing target was not produced: $target"
            }

            psign-tool --mode portable --verbose sign `
              --artifact-signing-endpoint "$env:TRUSTED_SIGNING_ENDPOINT" `
              --artifact-signing-account-name "$env:TRUSTED_SIGNING_ACCOUNT_NAME" `
              --artifact-signing-profile-name "$env:TRUSTED_SIGNING_PROFILE_NAME" `
              --artifact-signing-access-token "$accessToken" `
              --timestamp-url "$env:TRUSTED_SIGNING_TIMESTAMP_SERVER" `
              --timestamp-digest sha256 `
              --digest sha256 `
              --exit-codes azure `
              "$target"

            if ($LASTEXITCODE -ne 0) {
              throw "Trusted Signing failed for $target with exit code $LASTEXITCODE"
            }
          }

      - name: Pack dotnet tool packages
        shell: pwsh
        run: |
          $project = (Resolve-Path (Join-Path $PWD 'packaging/dotnet-tool/Devolutions.WinDbg.Tool.csproj')).Path
          $stagingRoot = (Resolve-Path (Join-Path $PWD 'work/payload')).Path
          $outputDirectory = Join-Path $PWD 'artifacts/nuget'

          if (Test-Path -LiteralPath $outputDirectory) {
            Remove-Item -LiteralPath $outputDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null

          $packArgs = @(
            'pack',
            $project,
            '-c', 'Release',
            '--no-build',
            '--no-restore',
            "-p:PackageVersion=$env:VERSION",
            "-p:WindbgToolStagingRoot=$stagingRoot",
            '-o', $outputDirectory
          )

          & dotnet @packArgs
          if ($LASTEXITCODE -ne 0) {
            throw 'dotnet tool package creation failed.'
          }

          $packages = @(Get-ChildItem -LiteralPath $outputDirectory -Filter 'Devolutions.WinDbg.Tool*.nupkg' -File)
          $ridPackages = @($packages | Where-Object {
            $_.Name -match '^Devolutions\.WinDbg\.Tool\.(win-x64|win-arm64|any)\.'
          })
          $pointerPackages = @($packages | Where-Object {
            $_.Name -notmatch '^Devolutions\.WinDbg\.Tool\.(win-x64|win-arm64|any)\.'
          })

          if ($ridPackages.Count -ne 3) {
            throw "Expected win-x64, win-arm64, and any packages; found $($ridPackages.Count)."
          }
          if ($pointerPackages.Count -ne 1) {
            throw "Expected one dotnet tool pointer package; found $($pointerPackages.Count)."
          }

      - name: Rebuild signed Windows ZIPs
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $PWD 'artifacts/release'
          $stagingRoot = Join-Path $PWD 'work/payload'
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null

          foreach ($mapping in @(
              @{ Rid = 'win-x64'; Name = 'windbg-tool-x64.zip' },
              @{ Rid = 'win-arm64'; Name = 'windbg-tool-arm64.zip' })) {
            $payloadDirectory = Join-Path $stagingRoot $mapping.Rid
            $archivePath = Join-Path $releaseDirectory $mapping.Name
            if (Test-Path -LiteralPath $archivePath) {
              Remove-Item -LiteralPath $archivePath -Force
            }

            Compress-Archive `
              -Path (Join-Path $payloadDirectory '*') `
              -DestinationPath $archivePath `
              -Force
          }

      - name: Validate Authenticode signatures in release packages
        if: steps.signing_mode.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $runtimeFiles = @(
            'TTDReplay.dll',
            'TTDReplayCPU.dll',
            'dbgeng.dll',
            'dbgcore.dll',
            'dbghelp.dll',
            'dbgmodel.dll',
            'msdia140.dll',
            'srcsrv.dll'
          )

          $packageDirectory = Join-Path $PWD 'artifacts/nuget'
          $packages = @(Get-ChildItem -LiteralPath $packageDirectory -Filter 'Devolutions.WinDbg.Tool*.nupkg' -File)
          if ($packages.Count -ne 4) {
            throw "Expected four dotnet tool packages to validate, found $($packages.Count)."
          }

          $archiveSpecs = @(
            [pscustomobject]@{
              ArchivePath = Join-Path $PWD 'artifacts/release/windbg-tool-x64.zip'
              Kind = 'zip'
              Rid = 'win-x64'
            },
            [pscustomobject]@{
              ArchivePath = Join-Path $PWD 'artifacts/release/windbg-tool-arm64.zip'
              Kind = 'zip'
              Rid = 'win-arm64'
            }
          )

          foreach ($rid in @('win-x64', 'win-arm64', 'any')) {
            $ridPattern = "^Devolutions\.WinDbg\.Tool\.$([regex]::Escape($rid))\..+\.nupkg$"
            $ridPackage = @($packages | Where-Object { $_.Name -match $ridPattern })
            if ($ridPackage.Count -ne 1) {
              throw "Expected one $rid dotnet tool package to validate, found $($ridPackage.Count)."
            }

            $archiveSpecs += [pscustomobject]@{
              ArchivePath = $ridPackage[0].FullName
              Kind = if ($rid -eq 'any') { 'any-nupkg' } else { 'rid-nupkg' }
              Rid = $rid
            }
          }

          $pointerPackages = @($packages | Where-Object {
            $_.Name -notmatch '^Devolutions\.WinDbg\.Tool\.(win-x64|win-arm64|any)\..+\.nupkg$'
          })
          if ($pointerPackages.Count -ne 1) {
            throw "Expected one dotnet tool pointer package to validate, found $($pointerPackages.Count)."
          }
          $archiveSpecs += [pscustomobject]@{
            ArchivePath = $pointerPackages[0].FullName
            Kind = 'pointer-nupkg'
            Rid = $null
          }

          $validationRoot = Join-Path $env:RUNNER_TEMP 'windbg-tool-signature-validation'
          if (Test-Path -LiteralPath $validationRoot) {
            Remove-Item -LiteralPath $validationRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $validationRoot | Out-Null

          function Test-ExpectedSigner {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path,

              [Parameter(Mandatory = $true)]
              [string]$ExpectedCommonName,

              [Parameter(Mandatory = $true)]
              [ValidateSet('project', 'microsoft')]
              [string]$Kind
            )

            # Digest-only PE binding check (no OS trust store).
            & psign-tool portable verify-pe $Path
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode digest validation failed for $Path."
            }

            $inspectionJson = & psign-tool portable inspect-authenticode $Path
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect the Authenticode signer for $Path."
            }

            $inspection = $inspectionJson | ConvertFrom-Json
            $signers = @(
              foreach ($entry in @($inspection.entries)) {
                foreach ($signer in @($entry.pkcs7.signers)) {
                  $signer
                }
              }
            )
            if ($signers.Count -eq 0) {
              throw "No embedded Authenticode signer was found for $Path."
            }

            $hasExpectedSigner = $false
            $hasRfc3161Timestamp = $false
            foreach ($signer in $signers) {
              if (-not [string]::IsNullOrWhiteSpace($signer.signer_certificate_der_base64)) {
                $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                  [Convert]::FromBase64String($signer.signer_certificate_der_base64)
                )
                try {
                  $subject = $certificate.Subject
                }
                finally {
                  $certificate.Dispose()
                }

                if ($subject -match "CN\s*=\s*$([regex]::Escape($ExpectedCommonName))(?:,|$)") {
                  $hasExpectedSigner = $true
                }
              }

              $unsignedOids = @($signer.unsigned_attribute_oids)
              $timestampHints = @($signer.timestamp_hints)
              if (
                ($unsignedOids -contains '1.3.6.1.4.1.311.3.3.1') -or
                ($timestampHints.kind -contains 'microsoft_nested_rfc3161_attribute') -or
                -not [string]::IsNullOrWhiteSpace($signer.timestamp_signer_certificate_der_base64)
              ) {
                $hasRfc3161Timestamp = $true
              }
            }

            if (-not $hasExpectedSigner) {
              throw "Authenticode signer for $Path is not $ExpectedCommonName."
            }

            if ($Kind -eq 'project') {
              if (-not $hasRfc3161Timestamp) {
                throw "Project-owned PE is missing an embedded RFC3161 Authenticode timestamp: $Path."
              }

                          # ACS short-lived code-signing certs need timestamp time, loose EKU
                          # acceptance, and online AIA for intermediate fetch. psign 0.6.2+
                          # accepts ACS/Microsoft RFC3161 tokens (fractional genTime + nested
                          # TSA CMS bags).
              & psign-tool portable trust-verify-pe `
                            --prefer-timestamp-signing-time `
                            --require-valid-timestamp `
                            --allow-loose-signing-cert `
                            --online-aia `
                            $Path
                          if ($LASTEXITCODE -ne 0) {
                            throw "Authenticode trust validation failed for $Path."
                          }
                        }
          }

          $extractionIndex = 0
          foreach ($spec in $archiveSpecs) {
            if (-not (Test-Path -LiteralPath $spec.ArchivePath -PathType Leaf)) {
              throw "Release archive was not produced: $($spec.ArchivePath)"
            }

            $prefix = if ($spec.Kind -eq 'zip' -or $spec.Kind -eq 'pointer-nupkg') {
              ''
            }
            else {
              "tools/net10.0/$($spec.Rid)/"
            }

            $projectOwnedFiles = @(switch ($spec.Kind) {
              'zip' {
                @(
                  "${prefix}windbg-tool.exe",
                  "${prefix}ttd_replay_bridge.dll"
                )
                break
              }
              'rid-nupkg' {
                @(
                  "${prefix}Devolutions.WinDbg.Tool.exe",
                  "${prefix}Devolutions.WinDbg.Tool.dll",
                  "${prefix}windbg-tool.exe",
                  "${prefix}ttd_replay_bridge.dll"
                )
                break
              }
              'any-nupkg' {
                @("${prefix}Devolutions.WinDbg.Tool.dll")
                break
              }
              default {
                @()
              }
            })
            $microsoftSignedFiles = if ($spec.Kind -in @('zip', 'rid-nupkg')) {
              @($runtimeFiles | ForEach-Object { "$prefix$_" })
            }
            else {
              @()
            }
            $expectedPeFiles = @($projectOwnedFiles + $microsoftSignedFiles)

            $archive = [IO.Compression.ZipFile]::OpenRead($spec.ArchivePath)
            try {
              $actualPeFiles = @(
                $archive.Entries |
                  Where-Object { $_.FullName -match '(?i)\.(exe|dll)$' } |
                  ForEach-Object { $_.FullName }
              )
              $unexpectedPeFiles = @($actualPeFiles | Where-Object { $_ -notin $expectedPeFiles })
              $missingPeFiles = @($expectedPeFiles | Where-Object { $_ -notin $actualPeFiles })
              if ($unexpectedPeFiles.Count -ne 0 -or $missingPeFiles.Count -ne 0) {
                $unexpectedText = $unexpectedPeFiles -join ', '
                $missingText = $missingPeFiles -join ', '
                throw "PE contents did not match the signed-file manifest for $($spec.ArchivePath). Unexpected: [$unexpectedText]. Missing: [$missingText]."
              }

              foreach ($entryName in $expectedPeFiles) {
                $entry = $archive.GetEntry($entryName)
                $extractedPath = Join-Path $validationRoot ('{0:D3}-{1}' -f $extractionIndex, [IO.Path]::GetFileName($entryName))
                $extractionIndex++

                $input = $entry.Open()
                $output = [IO.File]::Open($extractedPath, [IO.FileMode]::Create, [IO.FileAccess]::Write)
                try {
                  $input.CopyTo($output)
                }
                finally {
                  $output.Dispose()
                  $input.Dispose()
                }

                if ($entryName -in $projectOwnedFiles) {
                  Test-ExpectedSigner `
                    -Path $extractedPath `
                    -ExpectedCommonName 'Devolutions Inc' `
                    -Kind project
                }
                else {
                  Test-ExpectedSigner `
                    -Path $extractedPath `
                    -ExpectedCommonName 'Microsoft Corporation' `
                    -Kind microsoft
                }
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          Write-Host 'Validated all project-owned and Microsoft runtime PE signatures in release ZIP and NuGet packages.'

      - name: Upload signed Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: signed-windbg-tool
          path: artifacts/release/windbg-tool-*.zip
          if-no-files-found: error

      - name: Upload dotnet tool packages
        uses: actions/upload-artifact@v7
        with:
          name: windbg-tool-nuget
          path: artifacts/nuget/Devolutions.WinDbg.Tool*.nupkg
          if-no-files-found: error

  smoke-dotnet-tool:
    name: Smoke-test installed .NET tool
    if: github.event_name == 'workflow_dispatch'
    needs: sign-and-pack
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download dotnet tool packages
        uses: actions/download-artifact@v8
        with:
          name: windbg-tool-nuget
          path: artifacts\nuget

      - name: Install and run dotnet tool
        shell: pwsh
        run: |
          ./scripts/Test-WindbgDotnetToolPackage.ps1 `
            -Version '${{ inputs.version }}' `
            -PackageDir (Resolve-Path 'artifacts\nuget') `
            -ToolPath (Join-Path $env:RUNNER_TEMP 'windbg-tool-package-smoke')

  release:
    name: Publish GitHub Release
    needs:
      - package
      - sign-and-pack
      - smoke-dotnet-tool
      - preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Download signed Windows packages
        uses: actions/download-artifact@v8
        with:
          name: signed-windbg-tool
          path: release-assets

      - name: Download dotnet tool packages
        uses: actions/download-artifact@v8
        with:
          name: windbg-tool-nuget
          path: release-assets\dotnet-tool

      - name: Validate release inputs and assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Version must be a semantic version without the v prefix: $env:VERSION"
          }

          $tag = "v$env:VERSION"
          $assets = @(
            'windbg-tool-x64.zip',
            'windbg-tool-arm64.zip'
          )
          foreach ($asset in $assets) {
            $path = Join-Path $PWD "release-assets\$asset"
            if (-not (Test-Path -Path $path -PathType Leaf)) {
              throw "Release asset was not downloaded: $asset"
            }
          }

          $nugetPackages = @(Get-ChildItem -Path 'release-assets\dotnet-tool' -Filter 'Devolutions.WinDbg.Tool*.nupkg' -File)
          if ($nugetPackages.Count -ne 4) {
            throw "Expected four dotnet tool packages, found $($nugetPackages.Count)."
          }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path 'release-assets' -Recurse -File |
            Where-Object { $_.Extension -in @('.zip', '.nupkg') } |
            Sort-Object Name)
          if ($files.Count -ne 6) {
            throw "Expected six checksum inputs, found $($files.Count)."
          }

          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums |
            Set-Content -LiteralPath 'release-assets\checksums.txt' -Encoding ascii

          $response = & gh api --include "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            throw "Refusing to publish because tag $tag already exists."
          }

          $responseText = $response -join [Environment]::NewLine
          if ($responseText -notmatch '(?m)^HTTP/\S+ 404') {
            throw "Could not determine whether tag $tag exists: $responseText"
          }
          exit 0

      - name: Create release and upload packages
        if: inputs.dry_run == false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = "v$env:VERSION"
          $assets = @(
            (Join-Path $PWD 'release-assets\windbg-tool-x64.zip'),
            (Join-Path $PWD 'release-assets\windbg-tool-arm64.zip')
          )
          $assets += Get-ChildItem -Path 'release-assets\dotnet-tool' -Filter 'Devolutions.WinDbg.Tool*.nupkg' -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }
          $assets += Join-Path $PWD 'release-assets\checksums.txt'
          & gh release create $tag $assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "windbg-tool $tag" `
            --generate-notes

      - name: Report dry run
        if: inputs.dry_run
        shell: pwsh
        run: Write-Host "Dry run completed. Would create v$env:VERSION with the validated ZIPs, NuGet packages, and checksums."

  publish-nuget:
    name: Publish .NET tool to NuGet.org
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget
    needs:
      - sign-and-pack
      - smoke-dotnet-tool
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.preflight.outputs.publish_env }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Resolve publish mode
        id: publish_mode
        shell: pwsh
        env:
          NUGET_BOT_USERNAME: ${{ secrets.NUGET_BOT_USERNAME }}
        run: |
          $dryRun = [System.Boolean]::Parse('${{ inputs.dry_run }}')
          $hasLoginUser = -not [string]::IsNullOrWhiteSpace($env:NUGET_BOT_USERNAME)

          "dry_run=$($dryRun.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "has_login_user=$($hasLoginUser.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if (-not $dryRun -and -not $hasLoginUser) {
            throw 'NUGET_BOT_USERNAME is required when dry_run is false.'
          }

          Write-Host "NuGet dry-run mode: $dryRun"

      - name: Download dotnet tool packages
        uses: actions/download-artifact@v8
        with:
          name: windbg-tool-nuget
          path: dist

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC)
        if: steps.publish_mode.outputs.dry_run != 'true' && steps.publish_mode.outputs.has_login_user == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_BOT_USERNAME }}

      - name: Publish to NuGet.org (RID first, pointer last)
        shell: pwsh
        env:
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
        run: |
          $dryRun = [System.Boolean]::Parse('${{ inputs.dry_run }}')
          $apiKey = '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'

          if ($dryRun) {
            $apiKey = 'dry-run-key'
            Write-Host 'Dry Run: NuGet push commands will be printed but not executed.'
          }
          elseif ([string]::IsNullOrWhiteSpace($apiKey)) {
            throw 'NuGet login did not return an API key.'
          }

          $toolPackages = @(Get-ChildItem -Path 'dist' -Recurse -File -Filter 'Devolutions.WinDbg.Tool*.nupkg' |
            Sort-Object Name)
          $ridPattern = '^Devolutions\.WinDbg\.Tool\.(win-x64|win-arm64|any)\.'
          $ridPackages = @($toolPackages | Where-Object { $_.Name -match $ridPattern })
          $pointerPackages = @($toolPackages | Where-Object { $_.Name -notmatch $ridPattern })

          if ($ridPackages.Count -ne 3) {
            throw "Expected three RID packages (win-x64, win-arm64, any); found $($ridPackages.Count)."
          }
          if ($pointerPackages.Count -ne 1) {
            throw "Expected one dotnet tool pointer package; found $($pointerPackages.Count)."
          }

          foreach ($package in (@($ridPackages) + @($pointerPackages))) {
            $pushArgs = @(
              'nuget', 'push', "$($package.FullName)",
              '--api-key', "$apiKey",
              '--source', "$env:NUGET_SOURCE",
              '--skip-duplicate', '--no-symbols'
            )

            Write-Host "dotnet nuget push `"$($package.FullName)`" --api-key *** --source `"$env:NUGET_SOURCE`" --skip-duplicate --no-symbols"
            if (-not $dryRun) {
              & dotnet @pushArgs
              if ($LASTEXITCODE -ne 0) {
                throw "dotnet nuget push failed for $($package.Name) with exit code $LASTEXITCODE."
              }
            }
          }
